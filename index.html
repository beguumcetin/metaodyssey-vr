<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MetaOdyssey · Ephesus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div class="shade"></div>

  <header class="brand">
    <span class="mark">MetaOdyssey</span>
    <span class="where" id="where"></span>
  </header>


  <section id="intro" class="intro">
    <nav class="cities" id="cities" aria-label="Cities"></nav>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="intro-title"></h1>
    <p class="intro-sub" id="intro-sub"></p>
    <div class="intro-actions">
      <button id="start" class="primary" disabled>Loading</button>
      <button id="explore" class="ghost"></button>
      <button class="ghost vr-btn" hidden>VR</button>
    </div>
  </section>

  <nav id="chapters" class="chapters" hidden></nav>

  <div id="caption" class="caption" hidden>
    <p class="caption-title" id="caption-title"></p>
    <p class="caption-text" id="caption-text"></p>
  </div>

  <footer id="controls" class="controls" hidden>
    <div class="transport">
      <button id="prev" aria-label="Previous chapter">‹</button>
      <button id="play" class="play" aria-label="Pause">❚❚</button>
      <button id="next" aria-label="Next chapter">›</button>
    </div>
    <div class="extras">
      <button id="era" class="text"></button>
      <button id="sound" class="text"></button>
      <button class="text vr-btn" hidden>VR</button>
      <button id="credits-btn" class="text"></button>
    </div>
  </footer>

  <aside id="credits" class="panel" hidden>
    <button class="panel-close" data-close="credits" aria-label="Close">×</button>
    <h2>Credits</h2>
    <div id="credits-body"></div>
  </aside>

  <script type="module" src="src/main.js"></script>
</body>
</html>
