<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MetaOdyssey Virtual Museum: Ephesus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>

  <header class="top">
    <h1>MetaOdyssey</h1>
    <p class="sub">Virtual Museum</p>
  </header>
  <nav id="sites" class="sites"></nav>

  <div id="loading" class="loading">Loading the Library of Celsus…</div>

  <aside id="panel" class="panel" hidden>
    <button id="panel-close" class="panel-close" aria-label="Close">×</button>
    <h2 id="panel-title"></h2>
    <p id="panel-body"></p>
  </aside>

  <footer class="bottom">
    <span class="hint">Drag to look around · scroll to zoom · click the golden points</span>
    <span id="vr-slot"></span>
    <button id="credits-btn" class="link">Credits</button>
  </footer>

  <aside id="credits" class="panel" hidden>
    <button class="panel-close" data-close="credits" aria-label="Close">×</button>
    <h2>Credits</h2>
    <div id="credits-body"></div>
  </aside>

  <script type="module" src="src/main.js"></script>
</body>
</html>
